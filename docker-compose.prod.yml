x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "2m"
    max-file: "2"

services:
  livekit:
    logging: *bounded-logs
    image: livekit/livekit-server:v1.13.10
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./infra/livekit.prod.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml

  backend:
    logging: *bounded-logs
    image: ghcr.io/yzhu112/makeshift-discord-backend:latest
    network_mode: host
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - ./data:/app/data

  caddy:
    logging: *bounded-logs
    image: ghcr.io/yzhu112/makeshift-discord-frontend:latest
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro

  gateway:
    logging: *bounded-logs
    image: livekit/caddyl4@sha256:9dd090159a6042a907dbff0ce9dda27a21d2a559dc7b03b60a8e6b1b60b8348e
    network_mode: host
    restart: unless-stopped
    command: run --config /etc/caddy/gateway.json
    volumes:
      - ./infra/caddy-gateway.json:/etc/caddy/gateway.json:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
